# Publie la Release OTA. Trois déclencheurs :
#   - push du fichier publier.txt sur main (contenu = tag, ex. v1.1.0) ;
#   - manuel (workflow_dispatch) avec le tag en entrée ;
#   - push d'un tag v*.
# Les artefacts signés doivent être commités dans artefacts/<tag>/
# (zip + manifest.json + NOTES.md). La signature Ed25519 du manifest est
# vérifiée par l'app côté poste — ce workflow ne fait que l'hébergement.
name: Publier la release OTA
on:
  push:
    branches: ["main"]
    paths: ["publier.txt"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v1.1.0)"
        required: true
        default: "v1.1.0"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release avec les artefacts signés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}";
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME";
          else TAG="$(tr -d '[:space:]' < publier.txt)"; fi
          echo "Publication de $TAG"
          DIR="artefacts/$TAG"
          test -f "$DIR"/manifest.json || { echo "manifest.json absent de $DIR"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée — rien à faire."; exit 0; fi
          gh release create "$TAG" "$DIR"/podonote-app-*.zip "$DIR"/manifest.json \
            --title "Diktae ${TAG#v}" \
            --notes-file "$DIR/NOTES.md" \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
